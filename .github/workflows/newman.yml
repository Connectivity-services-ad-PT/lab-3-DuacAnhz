name: Contract and Newman Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contracts
        run: npx @stoplight/spectral-cli lint contracts/*.yaml

      - name: Start IoT mock server
        run: nohup npm run mock:iot > prism-iot.log 2>&1 &

      - name: Start Vision mock server
        run: nohup npm run mock:vision > prism-vision.log 2>&1 &

      - name: Wait for mock servers
        run: npx wait-on http://localhost:4010/health http://localhost:4011/health --timeout 30000

      - name: Run Newman tests
        run: npm run test:mock

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/